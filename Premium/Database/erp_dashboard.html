<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SellerERP Premium WebView Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #334155; padding: 20px; border-radius: 8px; text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 14px; }
        .card p { margin: 0; font-size: 22px; font-weight: bold; color: #34d399; }
        .footer { text-align: center; color: #64748b; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 SellerERP Premium Live Dashboard</h1>
        <div class="card-grid">
            <div class="card">
                <h3>총 매출액 (Revenue)</h3>
                <p>₩ 15,850,000</p>
            </div>
            <div class="card">
                <h3>예상 순이익 (Net Profit)</h3>
                <p>₩ 4,230,000</p>
            </div>
            <div class="card">
                <h3>평균 광고 ROAS</h3>
                <p>385 %</p>
            </div>
        </div>
        <div class="footer">Powered by PowerShell & WebView2 Engine | 2026 SellerERP System</div>
    </div>
</body>
</html>
